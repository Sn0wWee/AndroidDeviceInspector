name: Extract Android Project Sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          unzip -o AndroidDeviceInspector-source.zip
          test -f AndroidDeviceInspector/settings.gradle
          test -f AndroidDeviceInspector/app/src/main/AndroidManifest.xml

      - name: Commit extracted source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AndroidDeviceInspector/
          if git diff --cached --quiet; then
            echo "No extracted source changes."
          else
            git commit -m "Extract Android project source files"
            git push
          fi
