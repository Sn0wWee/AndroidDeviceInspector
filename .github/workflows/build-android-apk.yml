
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AndroidDeviceInspector-source.zip'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licences and install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip AndroidDeviceInspector-source.zip
          test -f AndroidDeviceInspector/settings.gradle

      - name: Build APK
        working-directory: AndroidDeviceInspector
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidDeviceInspector-APK
          path: AndroidDeviceInspector/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
